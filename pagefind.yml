# Pagefind configuration. The Dockerfile runs `npx pagefind` after `hugo`;
# to search a local build, run the same two commands and serve public/.
site: public
output_subdir: pagefind

# Only each page's <main data-pagefind-body> is indexed: the header, the
# 40-link navigation, the content-warning banner and the footer are the same
# on every page, and indexing them would make every page a hit for every word
# in the menu. The browse listings mark their link lists data-pagefind-ignore,
# since every title in them is indexed on the page it links to.
exclude_selectors:
  - "[data-pagefind-ignore]"
glob: "**/*.html"
