{{ define "main" }}
{{- $sets := sort (where site.RegularPages "Type" "item-set") "Params.id" "desc" }}
        <h1><span class="title">Item Sets</span></h1>
        <p class="row-count">All {{ len $sets }} item sets in this archive.</p>
<ul class="resource-list" data-pagefind-ignore>
{{- range $sets }}
    <li class="item-set resource">
        <a href="{{ .RelPermalink }}" tabindex="-1" aria-hidden="true"><img src="{{ partial "thumb.html" (dict "page" . "size" "square") }}" alt=""></a>
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    </li>
{{- end }}
</ul>
{{ end }}
