xinguinha and six other musicians in founding Oito Batutas (\"The Eight Aces\"), the most influential Brazilian band of the era. Donga and Pixinguinha forged important contacts  with powerful whites in the press and the recording industry, and they successfully positioned their group as a mixture of urban sophistication and rural simplicity."}],"foaf:birthday":[{"type":"numeric:timestamp","property_id":182,"property_label":"birthday","is_public":true,"@value":"1890","@type":"http:\/\/www.w3.org\/2001\/XMLSchema#gYear"}],"dcterms:dateSubmitted":[{"type":"numeric:timestamp","property_id":45,"property_label":"Date Submitted","is_public":true,"@value":"1974","@type":"http:\/\/www.w3.org\/2001\/XMLSchema#gYear"}],"dcterms:subject":[{"type":"resource:itemset","property_id":3,"property_label":"Subject","is_public":true,"@id":"https:\/\/hearingtheamericas.org\/api\/item_sets\/1093","value_resource_id":1093,"value_resource_name":"item_sets","url":"\/s\/the-americas\/item-set\/1093","display_title":"Brazilian Music","thumbnail_url":"https:\/\/hearingtheamericas.org\/files\/square\/8601717d69745f9764aebd541c1e9688a397148d.jpg","thumbnail_title":"OitoBatutas.jpeg","thumbnail_type":"image\/jpeg"}]}</script><script type="application/ld+json">{"@context":"https:\/\/hearingtheamericas.org\/api-context","@id":"https:\/\/hearingtheamericas.org\/api\/items\/784","@type":["o:Item","foaf:Person"],"o:id":784,"o:is_public":true,"o:owner":{"@id":"https:\/\/hearingtheamericas.org\/api\/users\/4","o:id":4},"o:resource_class":{"@id":"https:\/\/hearingtheamericas.org\/api\/resource_classes\/94","o:id":94},"o:resource_template":{"@id":"https:\/\/hearingtheamericas.org\/api\/resource_templates\/7","o:id":7},"o:thumbnail":{"@id":"https:\/\/hearingtheamericas.org\/api\/assets\/40","o:id":40},"o:title":"Oito Batutas","thumbnail_display_urls":{"large":"https:\/\/hearingtheamericas.org\/files\/asset\/27e93c116be27d4294f0817f8491a6ec352bf086.jpg","medium":"https:\/\/hearingtheamericas.org\/files\/asset\/27e93c116be27d4294f0817f8491a6ec352bf086.jpg","square":"https:\/\/hearingtheamericas.org\/files\/asset\/27e93c116be27d4294f0817f8491a6ec352bf086.jpg"},"o:created":{"@value":"2021-04-23T18:29:49+00:00","@type":"http:\/\/www.w3.org\/2001\/XMLSchema#dateTime"},"o:modified":{"@value":"2022-09-29T18:59:28+00:00","@type":"http:\/\/www.w3.org\/2001\/XMLSchema#dateTime"},"o:media":[{"@id":"https:\/\/hearingtheamericas.org\/api\/media\/785","o:id":785}],"o:item_set":[{"@id":"https:\/\/hearingtheamericas.org\/api\/item_sets\/55","o:id":55},{"@id":"https:\/\/hearingtheamericas.org\/api\/item_sets\/1093","o:id":1093}],"o:site":[{"@id":"https:\/\/hearingtheamericas.org\/api\/sites\/1","o:id":1},{"@id":"https:\/\/hearingtheamericas.org\/api\/sites\/2","o:id":2}],"dcterms:title":[{"type":"literal","property_id":1,"property_label":"Title","is_public":true,"@value":"Oito Batutas"}],"dcterms:description":[{"type":"literal","property_id":4,"property_label":"Description","is_public":true,"@value":"Os Oito Batutas (or \"The Eight Aces\") was the most influential Brazilian band of the 1920s. Led by the composer, flautist, and saxophonist Pixinguinha (Alfredo da Rocha Viana Filho), the band specialized in choro and related Brazilian dance genres. Oito Batutas was an integrated band featuring Black musicians such as Pixinguinha and Donga alongside whites. Although both Pixinguinha and Donga came from middle-class families, the group specialized in musical styles associated with the working class. During a six-month visit to Paris, the group incorporated jazz instrumentation; their music was celebrated by Parisian audiences as Black music. Upon their return to Rio de Janeiro, they were celebrated as the musical embodiment of Brazilian national identity. The following year, they recorded for Victor in the company's Buenos Aires studios. They are often seen as early progenitors of the iconic Brazilian genre of samba."}],"dcterms:hasPart":[{"type":"literal","property_id":34,"property_label"
