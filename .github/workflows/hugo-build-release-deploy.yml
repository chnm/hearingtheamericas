name: "[hearingtheamericas.org] Hugo Build, Release, Deploy"

# Not enabled yet: no host is set up to take this build. Deployment is still
# chnm/sustainability's static deploy of hearingtheamericas/. Until cutover the
# workflow runs only by hand and, with no FQDNs, builds without deploying.
# At cutover, restore the push trigger and the FQDNs, as in chnm/hurricanearchive:
#
#   push:
#     branches: ["**"]
#     paths: ['**', "!.github/**"]
#
#   website-devl-fqdn: "hearamerica.dev.chnm.gmu.edu"
#   website-prod-fqdn: "hearingtheamericas.org"

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths: ['**', "!.github/**"]

jobs:

  hugo-build-release-deploy:
    uses: chnm/.github/.github/workflows/hugo--build-release-deploy.yml@main
    secrets: inherit
    with:
      runner_labels: '["self-hosted","IncusOS"]'
      hugo-context-root: "."
      hugo-devl-url: "https://hta.dev.chnm.gmu.edu"
      hugo-prod-url: "https://hearingtheamericas.org"

      release-tag-name-type: "iso"
