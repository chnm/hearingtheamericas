# Hearing the Americas — Hugo source for the archive of the Omeka S site.
# See README.md. Page URLs are the archive's (…/item/4.html), so uglyURLs.
baseURL = "https://hearingtheamericas.org/"
title = "Hearing the Americas"
locale = "en-US"
uglyURLs = true
disablePathToLower = true
disableHugoGeneratorInject = true
disableKinds = ["taxonomy", "term", "rss", "sitemap", "robotsTXT", "404"]

[markup.goldmark.renderer]
  unsafe = true

# Written pages keep the HTML the Omeka page-block editor produced (content/*.html).
[security]
  allowContent = ['! ^text/org$']

[params]
  matomo_site_id = "11"

